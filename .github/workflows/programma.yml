# Builds Zapper control as a program you can just double-click: Windows (.exe),
# Mac (Apple silicon, .app in a zip) and Linux. Python is packed inside, so
# nothing has to be installed. Runs when control/zapper-control.py changes.
name: Zapper control als programma

on:
  push:
    branches: [main]
    paths: [control/zapper-control.py, .github/workflows/programma.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bouw:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            naam: Zapper-control-windows.exe
          - os: macos-latest
            naam: Zapper-control-mac.zip
          - os: ubuntu-22.04
            naam: Zapper-control-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==6.22.3 pillow
      - name: Windows
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --noconsole --name Zapper-control --icon beeld/icon-512.png control/zapper-control.py && move dist\Zapper-control.exe ${{ matrix.naam }}
        shell: cmd
      - name: Mac
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name "Zapper control" --icon beeld/icon-512.png --osx-bundle-identifier app.netlify.zappercontrol control/zapper-control.py
          # macOS asks before an app may use the local network; it needs a reason to show
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Zapper control looks for your ZAPPER lamps on your own network.'" "dist/Zapper control.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" -c "Add :NSBonjourServices:0 string _zapper._tcp" "dist/Zapper control.app/Contents/Info.plist"
          codesign --force --deep --sign - "dist/Zapper control.app"
          ditto -c -k --keepParent "dist/Zapper control.app" ${{ matrix.naam }}
      - name: Linux
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --name zapper-control control/zapper-control.py
          mv dist/zapper-control ${{ matrix.naam }}
          ./${{ matrix.naam }} --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.naam }}
          path: ${{ matrix.naam }}

  publiceer:
    needs: bouw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: uit
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versie=$(sed -n 's/^CONTROL_VERSIE = "\(.*\)"/\1/p' control/zapper-control.py)
          tag="control-$versie"
          (cd uit && sha256sum * > SHA256SUMS)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" uit/* --clobber
          else
            gh release create "$tag" uit/* --title "Zapper control $versie" --latest \
              --notes "Zapper control $versie as a program: download, double-click, done. Nothing to install."
          fi
