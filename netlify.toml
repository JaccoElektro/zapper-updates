# The download page for Zapper control, served straight from this repository.
# No build step: the files are published as they are.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/control/*"
  [headers.values]
    Content-Type = "text/x-python; charset=utf-8"
    Content-Disposition = "attachment; filename=zapper-control.py"
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.*"
  [headers.values]
    Cache-Control = "no-cache"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
